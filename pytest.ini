[pytest]
# pytest-homeassistant-custom-component registra fixtures asíncronas con
# autouse, así que sólo funciona con el modo asyncio automático.
#
# Esto vivía en un `pytest_configure` del conftest que escribía directamente
# en las tripas de pytest (`config.inicfg`). Funcionaba con pytest 9.0 y
# reventaba con 9.1 —un INTERNALERROR antes de recoger ningún test—, que es
# justo lo que pasó la primera vez que la CI ejecutó la batería.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
