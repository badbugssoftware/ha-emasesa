name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Cada lunes, contra la última versión de Home Assistant. Lo que rompe la
    # integración suele llegar sin que nadie toque el repositorio: un cambio de
    # Home Assistant que antes sólo avisaba en el registro.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tiene que ser la que exige la última versión de Home Assistant. Con una más
  # antigua pip no avisa: retrocede hasta la última versión de Home Assistant
  # que aún la aceptaba y los tests pasan contra un Home Assistant de meses
  # atrás. Con 3.13 se estuvo probando contra la 2026.2.3 en plena 2026.9.
  DEFAULT_PYTHON: "3.14"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # pytest-homeassistant-custom-component arrastra la versión de Home
          # Assistant contra la que se prueba, así que esto tarda un rato.
          python -m pip install -r requirements-test.txt

      - name: Tests
        run: python -m pytest -q
